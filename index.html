<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#176b62">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="manifest" href="site.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="北肿营养">
  <title>北肿临床营养科会诊思维录</title>
  <style>
    :root{--ink:#17322e;--muted:#667a76;--paper:#f5f7f3;--card:#fff;--green:#176b62;--line:#dfe7e2;--tag:#e9f3ef;--shadow:0 14px 40px rgba(27,61,54,.09)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.55}
    .hero{background:linear-gradient(135deg,#124e48,#1d7a6e);color:#fff;padding:max(32px,env(safe-area-inset-top)) 20px 56px}
    .wrap{width:min(980px,calc(100% - 32px));margin:auto}.eyebrow{font-size:13px;letter-spacing:.16em;opacity:.72}.hero h1{font-family:Georgia,"Songti SC",serif;font-size:clamp(28px,6vw,48px);line-height:1.18;margin:10px 0 8px}.hero p{margin:0;opacity:.82}
    .searchbox{margin:-27px auto 0;position:relative}.searchbox input{width:100%;height:56px;border:1px solid rgba(23,107,98,.15);border-radius:17px;background:#fff;box-shadow:var(--shadow);font-size:16px;padding:0 52px 0 48px;outline:none}.searchbox input:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(23,107,98,.11),var(--shadow)}.searchbox:before{content:"⌕";position:absolute;left:18px;top:9px;font-size:29px;color:var(--green)}#clear{position:absolute;right:13px;top:12px;border:0;background:#eef3f0;border-radius:50%;width:32px;height:32px;color:#52635f;font-size:18px;display:none}
    main{padding:26px 0 64px}.stats{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px;margin:0 0 22px}.dot{width:4px;height:4px;border-radius:50%;background:#9aaba6}
    .filters{margin-bottom:26px}.filter-title{font-size:13px;color:var(--muted);margin:0 0 9px}.chips{display:flex;gap:8px;overflow:auto;padding:0 0 5px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;color:#405651;border-radius:99px;padding:8px 13px;font-size:14px}.chip.active{background:var(--green);color:#fff;border-color:var(--green)}
    .section-head{display:flex;align-items:end;justify-content:space-between;margin:26px 0 13px}.section-head h2{font-family:Georgia,"Songti SC",serif;font-size:22px;margin:0}.section-head span{font-size:13px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{display:flex;flex-direction:column;min-height:235px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;color:inherit;text-decoration:none;box-shadow:0 3px 15px rgba(40,65,59,.035);transition:.18s ease}.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#bdd5ce}.meta{font-size:13px;color:var(--green);font-weight:650}.card h3{font-family:Georgia,"Songti SC",serif;font-size:21px;line-height:1.38;margin:10px 0 8px}.summary{font-size:14px;color:var(--muted);margin:0 0 16px}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}.tag{font-size:12px;padding:4px 8px;border-radius:6px;background:var(--tag);color:#38655e}.enter{margin-top:16px;font-size:14px;color:var(--green);font-weight:650}.empty{background:#fff;border:1px dashed #bfd0cb;border-radius:18px;text-align:center;padding:42px 20px;color:var(--muted);display:none}
    .guide{margin:0 0 24px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:0 15px}.guide summary{cursor:pointer;color:var(--green);font-weight:650;padding:12px 0}.guide p{color:var(--muted);font-size:14px;margin:0;padding:0 0 13px}footer{color:#85938f;text-align:center;font-size:12px;padding:0 16px 30px}.noscript{margin:20px auto;background:#fff2d8;color:#714e13;padding:12px;border-radius:10px}
    @media(max-width:650px){.wrap{width:min(100% - 24px,980px)}.hero{padding-left:12px;padding-right:12px}.hero h1{max-width:9em}.grid{grid-template-columns:1fr}.card{min-height:215px;padding:18px}.searchbox{margin-top:-25px}}
  </style>
</head>
<body>
  <header class="hero"><div class="wrap"><div class="eyebrow">BEIJING CANCER HOSPITAL · NUTRITION</div><h1>北肿临床营养科<br>会诊思维录</h1><p>从真实会诊现场，沉淀可复习的临床思维。</p></div></header>
  <div class="wrap searchbox"><input id="search" type="search" placeholder="搜索疾病、营养问题或关键词" aria-label="搜索病例"><button id="clear" aria-label="清空搜索">×</button></div>
  <main class="wrap">
    <noscript><div class="noscript">请在浏览器中允许 JavaScript，以使用搜索和分类功能。</div></noscript>
    <div class="stats"><span id="count">病例统计中</span><span class="dot"></span><span id="problemCount">营养问题统计中</span><span class="dot"></span><span id="lastUpdated">更新时间读取中</span></div>
    <details class="guide"><summary>使用说明</summary><p>可在搜索框中输入疾病、症状、药物或营养方式，也可以点击分类标签快速筛选病例。</p></details>
    <section class="filters" aria-label="病例筛选"><p class="filter-title">按疾病与营养问题筛选</p><div class="chips" id="chips"></div></section>
    <div class="section-head"><h2>会诊病例</h2><span id="resultLabel">按日期排列</span></div>
    <section class="grid" id="grid"></section><div class="empty" id="empty">没有找到匹配的病例，换一个关键词试试。</div>
  </main>
  <footer>病例已去标识化，仅供专业学习与复盘，不构成诊疗建议。</footer>
  <script>
    const fallbackCases = [
      {id:'20260808-rectal-cancer',date:'2026-08-07',title:'直肠癌术后：体重下降与呛咳',summary:'围绕摄入减少、体重下降、吞咽安全与营养通路选择的会诊记录。',disease:'结直肠癌',problems:['体重下降','吞咽障碍','ONS','EN'],tags:['呛咳','PEG','误吸','鸡汤误区'],file:'cases/20260807_XXX瘤_体重下降与呛咳.html'},
      {id:'20260807-rhabdomyosarcoma',date:'2026-08-07',title:'横纹肌肉瘤：体重下降与ONS选择',summary:'围绕放化疗后食欲下降、体重骤降与口服营养补充剂选择的会诊记录。',disease:'其他肿瘤',problems:['体重下降','恶病质','腹泻','ONS'],tags:['短肽','奥氮平','甲地孕酮'],file:'cases/20260807_横纹肌肉瘤_体重下降与ONS选择.html'},
      {id:'20260806-recurrent-laryngeal-nerve',date:'2026-08-06',title:'喉返神经受侵伴吞咽与饮水呛咳',summary:'围绕进食减少、吞咽困难、饮水呛咳与胃肠耐受性管理的会诊记录。',disease:'其他肿瘤',problems:['体重下降','呛咳','吞咽困难','ONS'],tags:['短肽','能全素','ONS'],file:'cases/20260806_喉返神经受侵伴吞咽与饮水呛咳.html'}
    ];
    let cases=fallbackCases, active='全部';
    const $=s=>document.querySelector(s), search=$('#search'), grid=$('#grid'), chips=$('#chips');
    function searchable(c){return [c.title,c.summary,c.disease,...c.problems,...c.tags].join(' ').toLowerCase()}
    function updateStats(){const problemTotal=new Set(cases.flatMap(c=>c.problems)).size;const modified=new Date(document.lastModified);const updated=Number.isNaN(modified.getTime())?'未知':modified.toLocaleDateString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit'}).replaceAll('/','-');$('#count').textContent=`共${cases.length}例`;$('#problemCount').textContent=`${problemTotal}种营养问题`;$('#lastUpdated').textContent=`最后更新：${updated}`}
    function render(){const q=search.value.trim().toLowerCase();const list=cases.filter(c=>(active==='全部'||[c.disease,...c.problems,...c.tags].includes(active))&&(!q||searchable(c).includes(q))).sort((a,b)=>b.date.localeCompare(a.date));grid.innerHTML=list.map(c=>`<a class="card" href="${encodeURI(c.file)}"><div class="meta">${c.date} · ${c.disease}</div><h3>${c.title}</h3><p class="summary">${c.summary}</p><div class="tags">${[...c.problems,...c.tags].slice(0,6).map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="enter">进入病例 →</div></a>`).join('');$('#empty').style.display=list.length?'none':'block';updateStats();$('#resultLabel').textContent=q||active!=='全部'?`找到 ${list.length} 个`:'按日期排列';$('#clear').style.display=q?'block':'none'}
    function renderChips(){const labels=['全部',...new Set(cases.flatMap(c=>[c.disease,...c.problems]))];chips.innerHTML=labels.map(x=>`<button class="chip${x===active?' active':''}" data-value="${x}">${x}</button>`).join('')}
    chips.addEventListener('click',e=>{if(!e.target.matches('.chip'))return;active=e.target.dataset.value;renderChips();render()});search.addEventListener('input',render);$('#clear').onclick=()=>{search.value='';search.focus();render()};
    fetch('cases.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(data=>{cases=data;renderChips();render()}).catch(()=>{});renderChips();render();
  </script>
</body>
</html>
