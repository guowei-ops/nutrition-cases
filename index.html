<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#172a3a">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="manifest" href="site.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="北肿营养">
  <title>北肿临床营养科会诊思维录</title>
  <style>
    :root{--ink:#172a3a;--text:#2c3b48;--muted:#6b7781;--paper:#f2f0eb;--card:#fbfaf7;--accent:#38566b;--accent-soft:#e8edf0;--line:#c9d2d8;--line-strong:#98a8b3;--soft:#e8ecef;--shadow:0 12px 24px -20px rgba(23,42,58,.76),0 4px 10px rgba(23,42,58,.07)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.65}
    button,input{font:inherit}.wrap{width:min(1120px,calc(100% - 40px));margin:auto}
    .hero{background:var(--ink);color:#fff;padding:max(42px,env(safe-area-inset-top)) 20px 76px;position:relative;overflow:hidden}
    .hero:after{content:"THINK";position:absolute;right:3vw;bottom:-62px;color:rgba(255,255,255,.028);font-size:clamp(110px,18vw,230px);font-weight:900;line-height:1;letter-spacing:-.08em}
    .hero .wrap{position:relative;z-index:1}.eyebrow{font-size:12px;letter-spacing:.18em;color:#9eacb6}.hero h1{font-family:Georgia,"Songti SC",serif;font-size:clamp(31px,5.2vw,56px);font-weight:700;line-height:1.16;letter-spacing:-.035em;margin:13px 0 11px}.hero p{max-width:660px;margin:0;color:#c8d1d7;font-size:15px}.hero-note{display:flex;gap:22px;flex-wrap:wrap;margin-top:28px;color:#9eacb6;font-size:12px}.hero-note b{display:block;color:#fff;font-size:15px;font-weight:600;margin-top:2px}
    .searchbox{margin:-30px auto 0;position:relative;z-index:2}.searchbox input{width:100%;height:62px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:16px;padding:0 54px 0 50px;color:var(--ink);outline:none}.searchbox input:focus{border-color:var(--line-strong);box-shadow:0 0 0 4px rgba(23,42,58,.07),var(--shadow)}.searchbox:before{content:"⌕";position:absolute;left:18px;top:10px;font-size:30px;color:var(--ink)}#clear{position:absolute;right:14px;top:15px;border:0;background:var(--soft);border-radius:50%;width:32px;height:32px;color:var(--muted);font-size:18px;display:none}
    main{padding:30px 0 72px}.stats{display:flex;gap:11px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px;margin:0 0 20px}.dot{width:4px;height:4px;border-radius:50%;background:#aab3ba}
    .guide{margin:0 0 25px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:0 16px}.guide summary{cursor:pointer;color:var(--ink);font-weight:700;padding:12px 0}.guide p{color:var(--muted);font-size:13px;margin:0;padding:0 0 13px}
    .filter-panel{border:1.5px solid var(--line);border-radius:14px;background:rgba(251,250,247,.8);padding:18px;margin-bottom:24px}.filters+.filters{margin-top:16px}.filter-title{font-size:12px;color:var(--muted);letter-spacing:.04em;margin:0 0 9px}.chips{display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px;overflow:visible}.chip{flex:0 0 auto;max-width:100%;white-space:normal;overflow-wrap:anywhere;text-align:center;line-height:1.35;border:1px solid var(--line);background:var(--card);color:var(--accent);border-radius:8px;padding:7px 11px;font-size:13px;cursor:pointer}.chip:hover{border-color:var(--line-strong);color:var(--ink)}.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
    .toolbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:28px 0 14px}.section-head h2{font-family:Georgia,"Songti SC",serif;color:var(--ink);font-size:25px;margin:0}.section-head span{display:block;font-size:12px;color:var(--muted);margin-top:3px}.view-switch{display:flex;gap:6px;padding:4px;background:#e4e7e8;border:1px solid #d3d9dd;border-radius:9px}.view-btn{border:0;border-radius:7px;padding:6px 10px;background:transparent;color:var(--muted);font-size:12px;cursor:pointer}.view-btn.active{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(23,42,58,.09)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{position:relative;display:flex;flex-direction:column;min-height:250px;background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:22px;color:inherit;text-decoration:none;box-shadow:0 7px 14px -12px rgba(23,42,58,.8),0 2px 4px rgba(23,42,58,.055);transition:border-color .18s ease,box-shadow .18s ease;overflow:hidden}.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:#29485e}.card:hover{box-shadow:0 8px 16px -12px rgba(23,42,58,.88),0 3px 6px rgba(23,42,58,.075);border-color:var(--line-strong)}.meta{font-size:12px;color:var(--accent);font-weight:750;letter-spacing:.02em}.card h3{font-family:Georgia,"Songti SC",serif;color:var(--ink);font-size:21px;line-height:1.4;margin:10px 0 8px}.summary{font-size:13.5px;color:var(--muted);margin:0 0 18px}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;min-width:0}.tag{max-width:100%;overflow-wrap:anywhere;white-space:normal;font-size:11.5px;padding:3px 8px;border:1px solid #d3dce1;border-radius:6px;background:var(--accent-soft);color:var(--accent)}.enter{margin-top:17px;font-size:13px;color:var(--ink);font-weight:700}.empty{background:var(--card);border:1.5px dashed var(--line);border-radius:14px;text-align:center;padding:42px 20px;color:var(--muted);display:none}
    footer{border-top:1px solid var(--line);color:#85919a;text-align:center;font-size:12px;padding:22px 16px max(28px,env(safe-area-inset-bottom))}.noscript{margin:20px auto;background:#fff2d8;color:#714e13;padding:12px;border-radius:10px}
    @media(max-width:700px){.wrap{width:min(100% - 24px,1120px)}.hero{padding:34px 12px 67px}.hero h1{max-width:9em}.hero-note{gap:16px;margin-top:22px}.searchbox{margin-top:-29px}.searchbox input{height:58px}.grid{grid-template-columns:1fr}.card{min-height:225px;padding:19px}.filter-panel{padding:14px}.chips{flex-wrap:wrap}.chip{flex:0 0 auto;max-width:100%;padding:7px 10px}.toolbar{align-items:flex-start;flex-direction:column}.view-switch{align-self:stretch}.view-btn{flex:1}.stats{gap:8px}.hero:after{right:-28px;bottom:-25px;font-size:105px}}
  </style>
</head>
<body>
  <header class="hero"><div class="wrap"><div class="eyebrow">BEIZHONG · CLINICAL NUTRITION</div><h1>北肿临床营养科<br>会诊思维录</h1><p>从病例事实出发，沿着医生的判断路径，沉淀为下一次可以调用的临床行动。</p><div class="hero-note"><span>内容结构<b>会诊记录 · 思维拆解</b></span><span>归档方式<b>按肿瘤分类</b></span></div></div></header>
  <div class="wrap searchbox"><input id="search" type="search" placeholder="搜索疾病、营养问题或关键词" aria-label="搜索病例"><button id="clear" aria-label="清空搜索">×</button></div>
  <main class="wrap">
    <noscript><div class="noscript">请在浏览器中允许 JavaScript，以使用搜索和分类功能。</div></noscript>
    <div class="stats"><span id="count">病例统计中</span><span class="dot"></span><span id="problemCount">营养问题统计中</span><span class="dot"></span><span id="lastUpdated">更新时间读取中</span></div>
    <details class="guide"><summary>使用说明</summary><p>可在搜索框中输入疾病、症状、药物或营养方式，也可以点击分类标签快速筛选病例。</p></details>
    <section class="filter-panel" aria-label="病例筛选">
      <div class="filters"><p class="filter-title">按肿瘤分类</p><div class="chips" id="diseaseChips"></div></div>
      <div class="filters"><p class="filter-title">按特殊营养问题</p><div class="chips" id="problemChips"></div></div>
    </section>
    <div class="toolbar"><div class="section-head"><h2>会诊病例</h2><span id="resultLabel">按日期排列</span></div><div class="view-switch" aria-label="病例范围"><button class="view-btn active" data-view="all">全部病例</button><button class="view-btn" data-view="recent">最近更新</button></div></div>
    <section class="grid" id="grid"></section><div class="empty" id="empty">没有找到匹配的病例，换一个关键词试试。</div>
  </main>
  <footer>病例已去标识化，仅供专业学习与复盘，不构成诊疗建议。</footer>
  <script>
    const fallbackCases = [
      {id:'20260811-sigmoid-colon-cancer',date:'2026-08-11',title:'乙状结肠癌术后：口腔溃疡、低钾与营养干预',summary:'围绕肝肺转移治疗后短期体重下降、口腔溃疡、低钾血症及流食—半流食阶梯干预的会诊记录。',disease:'乙状结肠癌',problems:['体重下降','营养不良','进食减少','口腔溃疡','低钾血症','ONS'],tags:['乙状结肠癌','肝转移','肺转移','佳维体','乳清蛋白粉','半流食'],file:'cases/20260811_乙状结肠癌_口腔溃疡低钾与营养干预.html'},
      {id:'20260810-pancreatic-cancer',date:'2026-08-10',title:'胰腺癌：消化不良与重度营养不良干预',summary:'围绕治疗后乏力、进食减少、消化不良、管饲依赖及短肽类/胰酶干预的会诊记录。',disease:'胰腺癌',problems:['体重下降','营养不良','进食减少','胃肠不耐受','EN','ONS'],tags:['短肽','胰酶','低蛋白血症','低钙血症','便秘','百普力'],file:'cases/20260810_胰腺癌_消化不良与重度营养不良干预.html'},
      {id:'20260810-ascending-colon-cancer',date:'2026-08-10',title:'升结肠癌肝转移术后：重度营养不良与阶梯肠内营养',summary:'围绕肝转移术后经口摄入不足、鼻空肠管饲、液体不足及水解蛋白补充的会诊记录。',disease:'升结肠癌',problems:['体重下降','营养不良','进食减少','EN','ONS'],tags:['肝转移','鼻空肠管','短肽','低蛋白血症','液体不足','百普力'],file:'cases/20260810_升结肠癌肝转移术后_重度营养不良与阶梯肠内营养.html'},
      {id:'20260811-lung-adenocarcinoma',date:'2026-08-11',title:'右肺腺癌Ⅳ期：蛋白质/能量失衡与ONS调整',summary:'围绕经口摄入显著不足、全营养制剂与蛋白粉比例失衡、血尿素升高及ONS精细化调整的会诊记录。',disease:'肺癌',problems:['进食减少','营养不良','蛋白质/能量失衡','血尿素升高','ONS'],tags:['右肺腺癌','多发转移','安素','蛋白粉','少量多餐','低钠血症','便秘'],file:'cases/20260811_右肺腺癌_蛋白质能量失衡与ONS调整.html'},
      {id:'20260808-rectal-cancer',date:'2026-08-07',title:'舌癌合并直肠癌术后：重度体重下降与误吸风险',summary:'围绕重度体重下降、吞咽/进食误吸风险、经口与管饲营养决策及饮食误区纠正的会诊记录。',disease:'舌癌合并直肠癌',problems:['体重下降','吞咽障碍','ONS','EN'],tags:['舌癌','直肠癌','肝转移','呛咳','PEG','误吸'],file:'cases/20260807_XXX瘤_体重下降与呛咳.html'},
      {id:'20260807-rhabdomyosarcoma',date:'2026-08-07',title:'横纹肌肉瘤：体重下降与ONS选择',summary:'围绕放化疗后食欲下降、体重骤降与口服营养补充剂选择的会诊记录。',disease:'其他肿瘤',problems:['体重下降','恶病质','腹泻','ONS'],tags:['短肽','奥氮平','甲地孕酮'],file:'cases/20260807_横纹肌肉瘤_体重下降与ONS选择.html'},
      {id:'20260806-dlbcl',date:'2026-08-06',title:'弥漫大B细胞淋巴瘤ⅣB期：进食减少与饮水呛咳',summary:'围绕食欲不振、半流食、进食量减少、体重下降、饮水呛咳与胃肠耐受性管理的会诊记录。',disease:'淋巴瘤',problems:['进食减少','体重下降','饮水呛咳','胃肠不耐受','ONS'],tags:['弥漫大B细胞淋巴瘤','非霍奇金淋巴瘤','短肽','能全素'],file:'cases/20260806_喉返神经受侵伴吞咽与饮水呛咳.html'}
    ];
    const hiddenCommonFilters=new Set(['体重下降','营养不良','进食减少','ONS','恶病质','胃肠不耐受']);
    let cases=fallbackCases, active='全部', viewMode='all', repoUpdatedDate='';
    const $=s=>document.querySelector(s), search=$('#search'), grid=$('#grid'), diseaseChips=$('#diseaseChips'), problemChips=$('#problemChips');
    function searchable(c){return [c.title,c.summary,c.disease,...c.problems,...c.tags].join(' ').toLowerCase()}
    function beijingDate(value){const date=new Date(value);if(Number.isNaN(date.getTime()))return '';return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(date)}
    function updateStats(){const problemTotal=new Set(cases.flatMap(c=>c.problems)).size;const latestCaseDate=cases.map(c=>c.date).sort().at(-1)||'';const pageDate=beijingDate(document.lastModified);const updated=[latestCaseDate,pageDate,repoUpdatedDate].filter(Boolean).sort().at(-1)||'未知';$('#count').textContent=`共${cases.length}例`;$('#problemCount').textContent=`${problemTotal}种营养问题`;$('#lastUpdated').textContent=`最后更新：${updated}`}
    function syncRepositoryUpdateTime(){fetch('https://api.github.com/repos/guowei-ops/nutrition-cases/commits/main',{cache:'no-store',headers:{Accept:'application/vnd.github+json'}}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(data=>{repoUpdatedDate=beijingDate(data.commit&&data.commit.committer&&data.commit.committer.date);updateStats()}).catch(()=>{})}
    function render(){const q=search.value.trim().toLowerCase();let list=cases.filter(c=>(active==='全部'||[c.disease,...c.problems,...c.tags].includes(active))&&(!q||searchable(c).includes(q))).sort((a,b)=>b.date.localeCompare(a.date)||a.title.localeCompare(b.title,'zh-CN'));if(viewMode==='recent'&&!q&&active==='全部')list=list.slice(0,6);grid.innerHTML=list.map(c=>`<a class="card" href="${encodeURI(c.file)}"><div class="meta">${c.date} · ${c.disease}</div><h3>${c.title}</h3><p class="summary">${c.summary}</p><div class="tags">${[...c.problems,...c.tags].slice(0,6).map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="enter">进入病例 →</div></a>`).join('');$('#empty').style.display=list.length?'none':'block';updateStats();$('#resultLabel').textContent=q||active!=='全部'?`找到 ${list.length} 个`:viewMode==='recent'?'最近更新的病例':'按日期排列';$('#clear').style.display=q?'block':'none'}
    function renderChips(){const diseases=['全部',...new Set(cases.map(c=>c.disease))];const problems=[...new Set(cases.flatMap(c=>c.problems.filter(p=>!hiddenCommonFilters.has(p))))];diseaseChips.innerHTML=diseases.map(x=>`<button class="chip${x===active?' active':''}" data-value="${x}">${x}</button>`).join('');problemChips.innerHTML=problems.map(x=>`<button class="chip${x===active?' active':''}" data-value="${x}">${x}</button>`).join('')}
    function chooseFilter(e){if(!e.target.matches('.chip'))return;active=e.target.dataset.value;renderChips();render()}
    diseaseChips.addEventListener('click',chooseFilter);problemChips.addEventListener('click',chooseFilter);document.querySelectorAll('.view-btn').forEach(btn=>btn.addEventListener('click',()=>{viewMode=btn.dataset.view;document.querySelectorAll('.view-btn').forEach(x=>x.classList.toggle('active',x===btn));render()}));search.addEventListener('input',render);$('#clear').onclick=()=>{search.value='';search.focus();render()};
    fetch('cases.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(data=>{cases=data;renderChips();render()}).catch(()=>{});renderChips();render();syncRepositoryUpdateTime();
  </script>
</body>
</html>
